name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        id: build
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/images _site/downloads _site/field
          cp -a site/. _site/
          decode() {
            name="$1"
            dest="$2"
            expect="$3"
            dir="media/v2/${name}"
            if [ ! -d "$dir" ]; then
              echo "missing ${name}"
              return 1
            fi
            n=$(find "$dir" -type f | wc -l)
            if [ "$n" -lt "$expect" ]; then
              echo "${name} has ${n} of ${expect}"
              return 1
            fi
            mkdir -p "$(dirname "$dest")"
            find "$dir" -type f | sort | xargs cat | base64 -d > "$dest"
            test -s "$dest"
          }
          decode site-dusk.jpg _site/images/site-dusk.jpg 6 || echo "dusk not ready"
          decode materials.jpg _site/images/materials.jpg 2 || echo "materials not ready"
          decode DeRueda-arm64-v8a.apk _site/downloads/DeRueda-arm64-v8a.apk 19 || echo "arm64 not ready"
          decode DeRueda-armeabi-v7a.apk _site/downloads/DeRueda-armeabi-v7a.apk 19 || echo "arm32 not ready"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.ready == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.ready == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.build.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
