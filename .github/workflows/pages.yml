name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        id: build
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/images _site/downloads _site/field
          cp -a site/. _site/
          decode_parts() {
            name="$1"
            dest="$2"
            dir="media/parts/${name}"
            if [ ! -d "$dir" ]; then
              echo "missing ${name}"
              return 1
            fi
            mkdir -p "$(dirname "$dest")"
            find "$dir" -type f -print | sort | xargs cat | base64 -d > "$dest"
            test -s "$dest"
          }
          decode_parts og.jpg _site/og.jpg
          if [ -d media/parts/materials.jpg ]; then
            decode_parts materials.jpg _site/images/materials.jpg
          fi
          if [ -d media/parts/site-dusk.jpg ]; then
            decode_parts site-dusk.jpg _site/images/site-dusk.jpg
          fi
          if [ -d media/parts/DeRueda.apk ]; then
            decode_parts DeRueda.apk _site/downloads/DeRueda.apk
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.ready == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.ready == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.build.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
